<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="Assest/White and Blue Modern Minimalist Technology Logo.png">
<style>
    *{
        margin: 0;
        padding: 0;
        font-family: sans-serif;
    }
    img{
        background-color: transparent;
    }
    header{
        background-color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .ancher a {
        
        color: black;
        text-decoration: none;
        
    }
    .ancher{
        display: flex;
        gap: 60px;
        margin-left: 20px;
        font-size: 18px;
    }
    #bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.container{
    border: 3px solid white;
    width: 390px;
    height: 500px;
    margin: 50px 478px;
    background-color: rgba(0, 0, 0, 0.507);
    
}
.container h2{
    color: white;
    text-align: center;
    margin-top: 35px;
    font-size: 26px;
}
form{
    margin-top: 50px;
}
.form{
 text-align: center;
 margin-top: 25px;
 
}
input{
    margin-top: 20px;
    border: 2px solid rgb(68, 68, 68);
    border-radius: 6px;
    padding: 15px 5px;
    width: 265px;
}
.login{
    margin-top: 10px;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 10px 20px;
    text-align: center;
    margin: 25px 158px;
    cursor: pointer;

}
.sign-up{
    display: flex;
    text-align: center;
    margin: 4px 90px;

    color: white;
}
.sign-up a{
    font-size: 16px;
    color: coral;
}
</style>
</head>
<body>
    
    <header >
        <button style="background-color: white; border: 1px solid white; cursor: pointer;">
        <a href="./index.html"><img  src="./Assest/White and Blue Modern Minimalist Technology Logo.png" alt="" width="170px" height="90px"></a></button>

        <div class="ancher">
            <a href="#">Home</a>
            <a href="#">Contact</a>
            <a href="#">Services</a>
            <a href="#">Help</a>
        </div>
    </header>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="./Assest/background.mp4" type="video/mp4">
    </video>

    <div class="container">
        
        <h2>Login</h2>
        <form>
        <div class="form">
            <input type="email" placeholder="Email">
        </div>
        <div class="form">
            <input type="password" placeholder="Password">
        </div>
        </form>
        <button class="login">Login</button>
        <div class="sign-up">
            <h3>Create Account &nbsp;&nbsp;</h3>
            <a  href="./signup.html"> Sign up</a>
        </div>
    </div>

    

</body>
</html>
